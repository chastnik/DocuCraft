<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuCraft - Вход в систему</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            padding: 40px;
        }

        .logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .logo p {
            color: #6b7280;
            font-size: 14px;
        }

        .setup-notice {
            background: #fef3c7;
            border: 1px solid #fbbf24;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #92400e;
            font-size: 14px;
            line-height: 1.5;
        }

        .setup-notice strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #374151;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group input.error {
            border-color: #ef4444;
        }

        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #374151;
        }

        .btn-secondary:hover {
            background: #e5e7eb;
        }

        .form-switch {
            text-align: center;
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }

        .form-switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .form-switch a:hover {
            text-decoration: underline;
        }

        .loading {
            display: none;
            text-align: center;
            color: #6b7280;
            margin-top: 16px;
        }

        .loading.show {
            display: block;
        }

        .success-message {
            background: #d1fae5;
            border: 1px solid #10b981;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 24px;
            color: #065f46;
            font-size: 14px;
            display: none;
        }

        .success-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>DocuCraft</h1>
            <p>Автоматическая генерация документации</p>
        </div>

        <div class="setup-notice" id="setupNotice" style="display: none;">
            <strong>🎉 Добро пожаловать!</strong>
            <p>Это первая установка системы. Создайте администратора для начала работы.</p>
        </div>

        <div class="success-message" id="successMessage"></div>

        <form id="authForm">
            <div id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" name="email" required autocomplete="email">
                    <div class="error-message" id="loginEmailError"></div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Пароль</label>
                    <input type="password" id="loginPassword" name="password" required autocomplete="current-password">
                    <div class="error-message" id="loginPasswordError"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="loginBtn" onclick="return false;">
                    Войти
                </button>

                <div class="form-switch">
                    Нет аккаунта? <a href="javascript:void(0)" id="showRegister">Зарегистрироваться</a>
                </div>
            </div>

            <div id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" name="email" required autocomplete="email">
                    <div class="error-message" id="registerEmailError"></div>
                </div>

                <div class="form-group">
                    <label for="registerUsername">Имя пользователя</label>
                    <input type="text" id="registerUsername" name="username" required autocomplete="username" minlength="3">
                    <div class="error-message" id="registerUsernameError"></div>
                </div>

                <div class="form-group">
                    <label for="registerPassword">Пароль</label>
                    <input type="password" id="registerPassword" name="password" required autocomplete="new-password" minlength="8" maxlength="72" placeholder="Минимум 8 символов, максимум 72 байта">
                    <div class="error-message" id="registerPasswordError"></div>
                </div>

                <div class="form-group">
                    <label for="registerPasswordConfirm">Подтвердите пароль</label>
                    <input type="password" id="registerPasswordConfirm" name="passwordConfirm" required autocomplete="new-password">
                    <div class="error-message" id="registerPasswordConfirmError"></div>
                </div>

                <button type="submit" class="btn btn-primary" id="registerBtn" onclick="return false;">
                    Зарегистрироваться
                </button>

                <div class="form-switch">
                    Уже есть аккаунт? <a href="javascript:void(0)" id="showLogin">Войти</a>
                </div>
            </div>
        </form>

        <div class="loading" id="loading">
            Загрузка...
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/auth';
        let isRegisterMode = false;
        let needsSetup = false;

        // Check setup status on load
        async function checkSetupStatus() {
            try {
                console.log('Checking setup status...');
                const response = await fetch(`${API_BASE}/setup-status`);
                console.log('Setup status response:', response.status);
                const data = await response.json();
                console.log('Setup status data:', data);
                needsSetup = data.needs_setup;
                
                if (needsSetup) {
                    const setupNotice = document.getElementById('setupNotice');
                    if (setupNotice) {
                        setupNotice.textContent = 'Система не настроена. Создайте первого администратора.';
                        setupNotice.style.display = 'block';
                    }
                    console.log('System needs setup, showing register form');
                    showRegisterForm();
                } else {
                    console.log('System already set up, showing login form');
                    showLoginForm();
                }
            } catch (error) {
                console.error('Failed to check setup status:', error);
                showLoginForm();
            } finally {
                const loading = document.getElementById('loading');
                if (loading) loading.style.display = 'none';
            }
        }

        function showRegisterForm() {
            console.log('showRegisterForm called');
            isRegisterMode = true;
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const setupNotice = document.getElementById('setupNotice');
            
            console.log('Forms found:', { loginForm: !!loginForm, registerForm: !!registerForm });
            
            if (loginForm) loginForm.style.display = 'none';
            if (registerForm) {
                registerForm.style.display = 'block';
                console.log('Register form shown');
            }
            if (setupNotice) setupNotice.style.display = needsSetup ? 'block' : 'none';
            
            // Clear form errors
            clearErrors();
            
            console.log('isRegisterMode set to:', isRegisterMode);
        }

        function showLoginForm() {
            isRegisterMode = false;
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const setupNotice = document.getElementById('setupNotice');
            
            if (registerForm) registerForm.style.display = 'none';
            if (loginForm) loginForm.style.display = 'block';
            if (setupNotice) setupNotice.style.display = 'none';
            
            // Clear form errors
            clearErrors();
        }

        function showError(fieldId, message) {
            const errorEl = document.getElementById(fieldId + 'Error');
            if (errorEl) {
                errorEl.textContent = message;
                errorEl.classList.add('show');
                document.getElementById(fieldId).classList.add('error');
            }
        }

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.remove('show');
                el.textContent = '';
            });
            document.querySelectorAll('input').forEach(el => {
                el.classList.remove('error');
            });
        }

        function showSuccess(message) {
            const successEl = document.getElementById('successMessage');
            successEl.textContent = message;
            successEl.classList.add('show');
            setTimeout(() => {
                successEl.classList.remove('show');
            }, 5000);
        }

        async function handleLogin(event) {
            event.preventDefault();
            clearErrors();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Вход...';

            try {
                const formData = new FormData();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();

                if (response.ok) {
                    // Save token
                    localStorage.setItem('access_token', data.access_token);
                    // Redirect to dashboard
                    window.location.href = '/dashboard.html';
                } else {
                    showError('loginPassword', data.detail || 'Неверный email или пароль');
                }
            } catch (error) {
                showError('loginPassword', 'Ошибка подключения к серверу');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            event.stopPropagation();
            console.log('handleRegister called');
            
            clearErrors();

            const email = document.getElementById('registerEmail').value.trim();
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value;
            const passwordConfirm = document.getElementById('registerPasswordConfirm').value;

            console.log('Form values:', { email, username, passwordLength: password.length });

            // Validate passwords match
            if (password !== passwordConfirm) {
                showError('registerPasswordConfirm', 'Пароли не совпадают');
                return;
            }

            // Validate password length (bcrypt limitation: 72 bytes max)
            if (password.length < 8) {
                showError('registerPassword', 'Пароль должен быть не менее 8 символов');
                return;
            }
            // Check byte length (UTF-8 encoding)
            const passwordBytes = new TextEncoder().encode(password);
            if (passwordBytes.length > 72) {
                showError('registerPassword', 'Пароль слишком длинный (максимум 72 байта)');
                return;
            }

            // Validate email
            if (!email || !email.includes('@')) {
                showError('registerEmail', 'Введите корректный email');
                return;
            }

            // Validate username
            if (!username || username.length < 3) {
                showError('registerUsername', 'Имя пользователя должно быть не менее 3 символов');
                return;
            }

            const btn = document.getElementById('registerBtn');
            if (!btn) {
                console.error('Register button not found');
                return;
            }
            
            btn.disabled = true;
            btn.textContent = 'Регистрация...';

            try {
                console.log('Sending registration request to:', `${API_BASE}/register`);
                
                const response = await fetch(`${API_BASE}/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email,
                        username,
                        password,
                    }),
                });

                console.log('Response status:', response.status);
                
                let data;
                try {
                    data = await response.json();
                    console.log('Response data:', data);
                } catch (e) {
                    console.error('Failed to parse response:', e);
                    showError('registerEmail', 'Ошибка обработки ответа сервера');
                    btn.disabled = false;
                    btn.textContent = 'Зарегистрироваться';
                    return;
                }

                if (response.ok) {
                    if (needsSetup) {
                        showSuccess('✅ Администратор успешно создан! Теперь вы можете войти в систему.');
                        setTimeout(() => {
                            showLoginForm();
                            document.getElementById('loginEmail').value = email;
                        }, 2000);
                    } else {
                        showSuccess('✅ Регистрация успешна! Теперь вы можете войти в систему.');
                        setTimeout(() => {
                            showLoginForm();
                            document.getElementById('loginEmail').value = email;
                        }, 2000);
                    }
                } else {
                    console.error('Registration failed:', data);
                    if (data.detail) {
                        if (typeof data.detail === 'string') {
                            if (data.detail.toLowerCase().includes('email') || data.detail.toLowerCase().includes('почт')) {
                                showError('registerEmail', data.detail);
                            } else if (data.detail.toLowerCase().includes('username') || data.detail.toLowerCase().includes('имя')) {
                                showError('registerUsername', data.detail);
                            } else {
                                showError('registerEmail', data.detail);
                            }
                        } else if (Array.isArray(data.detail)) {
                            // Handle validation errors
                            data.detail.forEach((err) => {
                                const field = err.loc && err.loc[err.loc.length - 1];
                                if (field) {
                                    showError(`register${field.charAt(0).toUpperCase() + field.slice(1)}`, err.msg);
                                }
                            });
                        } else {
                            showError('registerEmail', 'Ошибка регистрации');
                        }
                    } else {
                        showError('registerEmail', 'Ошибка регистрации. Проверьте введенные данные.');
                    }
                }
            } catch (error) {
                console.error('Registration error:', error);
                showError('registerEmail', 'Ошибка подключения к серверу: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Зарегистрироваться';
            }
            
            return false;
        }

        // Event listeners - wait for DOM to be ready
        function initEventListeners() {
            const showRegisterBtn = document.getElementById('showRegister');
            const showLoginBtn = document.getElementById('showLogin');
            const authForm = document.getElementById('authForm');

            if (showRegisterBtn) {
                showRegisterBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    showRegisterForm();
                    return false;
                }, true); // Use capture phase
                
                // Fallback onclick handler
                showRegisterBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showRegisterForm();
                    return false;
                };
            } else {
                console.error('showRegister button not found');
            }

            if (showLoginBtn) {
                showLoginBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    showLoginForm();
                    return false;
                }, true); // Use capture phase
                
                // Fallback onclick handler
                showLoginBtn.onclick = function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    showLoginForm();
                    return false;
                };
            }

            if (authForm) {
                authForm.addEventListener('submit', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Form submit, isRegisterMode:', isRegisterMode);
                    
                    if (isRegisterMode) {
                        handleRegister(e);
                    } else {
                        handleLogin(e);
                    }
                    return false;
                }, false);
                
                // Also prevent default form submission
                authForm.onsubmit = function(e) {
                    e.preventDefault();
                    if (isRegisterMode) {
                        handleRegister(e);
                    } else {
                        handleLogin(e);
                    }
                    return false;
                };
            }

            // Direct button handlers as fallback
            const registerBtn = document.getElementById('registerBtn');
            const loginBtn = document.getElementById('loginBtn');
            
            if (registerBtn) {
                registerBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Register button clicked directly, isRegisterMode:', isRegisterMode);
                    // Check if register form is visible
                    const registerForm = document.getElementById('registerForm');
                    const isVisible = registerForm && registerForm.style.display !== 'none';
                    console.log('Register form visible:', isVisible);
                    
                    if (isRegisterMode || isVisible) {
                        const fakeEvent = { preventDefault: () => {}, stopPropagation: () => {} };
                        handleRegister(fakeEvent);
                    } else {
                        console.warn('Register button clicked but form is not in register mode');
                    }
                    return false;
                }, true);
            } else {
                console.error('Register button not found');
            }
            
            if (loginBtn) {
                loginBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    console.log('Login button clicked directly');
                    if (!isRegisterMode) {
                        const fakeEvent = { preventDefault: () => {}, stopPropagation: () => {} };
                        handleLogin(fakeEvent);
                    }
                    return false;
                }, true);
            }
        }

        // Check if user is already logged in
        if (localStorage.getItem('access_token')) {
            window.location.href = '/dashboard.html';
        }

        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                initEventListeners();
                checkSetupStatus();
            });
        } else {
            initEventListeners();
            checkSetupStatus();
        }
    </script>
</body>
</html>
