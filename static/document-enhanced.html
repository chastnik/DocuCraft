<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuCraft - Документ</title>
    <link rel="stylesheet" href="/static/css/common.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <style>
        .document-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            padding: 1rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            flex-wrap: wrap;
            gap: 0.75rem;
        }

        .toolbar-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .editor-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border-color);
        }

        .editor-tab {
            padding: 0.75rem 1.5rem;
            background: none;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            margin-bottom: -2px;
        }

        .editor-tab:hover {
            color: var(--text-primary);
        }

        .editor-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }

        .editor-tab-content {
            display: none;
        }

        .editor-tab-content.active {
            display: block;
        }

        .quill-editor {
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            min-height: 600px;
        }

        .quill-editor .ql-editor {
            min-height: 600px;
            font-size: 1rem;
            line-height: 1.8;
        }

        .versions-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .version-item {
            padding: 1rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .version-item:hover {
            box-shadow: var(--shadow-md);
        }

        .version-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .version-number {
            font-weight: 600;
            color: var(--accent-color);
        }

        .version-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .comment-form {
            margin-bottom: 1.5rem;
        }

        .comment-item {
            padding: 1rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            margin-left: 0;
        }

        .comment-item.reply {
            margin-left: 2rem;
        }

        .comment-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .comment-author {
            font-weight: 600;
            color: var(--text-primary);
        }

        .comment-date {
            font-size: 0.875rem;
            color: var(--text-muted);
        }

        .comment-text {
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .comment-actions {
            display: flex;
            gap: 0.5rem;
        }

        .save-indicator {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.5rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            display: none;
            z-index: 1000;
        }

        .save-indicator.show {
            display: block;
        }

        .save-indicator.saving {
            color: var(--warning-color);
        }

        .save-indicator.saved {
            color: var(--success-color);
        }

        .save-indicator.error {
            color: var(--error-color);
        }

        /* Quill theme adaptation */
        .ql-toolbar {
            background-color: var(--bg-secondary);
            border-color: var(--border-color);
        }

        .ql-container {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            border-color: var(--border-color);
        }

        .ql-editor {
            color: var(--text-primary);
        }

        .ql-stroke {
            stroke: var(--text-secondary);
        }

        .ql-fill {
            fill: var(--text-secondary);
        }

        .ql-picker-label {
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/dashboard.html" class="navbar-brand">
                📚 DocuCraft
            </a>
            <div class="navbar-actions">
                <button class="btn-icon" onclick="themeManager.toggle(); location.reload();" title="Переключить тему">
                    🌓
                </button>
                <span id="userName" class="text-secondary"></span>
                <button class="btn btn-secondary" onclick="logout()">Выйти</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="documentHeader" class="project-header">
            <div class="loading">
                <div class="spinner"></div>
                <span style="margin-left: 0.5rem;">Загрузка...</span>
            </div>
        </div>

        <div class="document-toolbar">
            <div class="editor-tabs">
                <button class="editor-tab active" onclick="switchTab('edit')">✏️ Редактирование</button>
                <button class="editor-tab" onclick="switchTab('versions')">📜 Версии</button>
                <button class="editor-tab" onclick="switchTab('comments')">💬 Комментарии</button>
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-secondary" onclick="exportDocument('pdf')">📄 PDF</button>
                <button class="btn btn-secondary" onclick="exportDocument('html')">🌐 HTML</button>
                <button class="btn btn-secondary" onclick="exportDocument('md')">📝 Markdown</button>
                <button class="btn btn-secondary" onclick="goBack()">← Назад</button>
                <button class="btn btn-primary" onclick="saveDocument()" id="saveBtn">💾 Сохранить</button>
            </div>
        </div>

        <!-- Edit Tab -->
        <div id="editTab" class="editor-tab-content active">
            <div id="quillEditor" class="quill-editor"></div>
        </div>

        <!-- Versions Tab -->
        <div id="versionsTab" class="editor-tab-content">
            <div id="versionsList" class="versions-list">
                <div class="loading">
                    <div class="spinner"></div>
                    <span style="margin-left: 0.5rem;">Загрузка версий...</span>
                </div>
            </div>
        </div>

        <!-- Comments Tab -->
        <div id="commentsTab" class="editor-tab-content">
            <div class="comments-section">
                <div class="comment-form">
                    <textarea id="commentText" class="form-textarea" rows="3" placeholder="Добавить комментарий..."></textarea>
                    <div class="form-actions" style="margin-top: 0.5rem;">
                        <button class="btn btn-primary" onclick="addComment()">Добавить комментарий</button>
                    </div>
                </div>
                <div id="commentsList" class="comments-section">
                    <div class="loading">
                        <div class="spinner"></div>
                        <span style="margin-left: 0.5rem;">Загрузка комментариев...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="saveIndicator" class="save-indicator"></div>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/document-editor.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const documentId = urlParams.get('id');

        if (!documentId) {
            window.location.href = '/dashboard.html';
        }

        if (!api.token) {
            window.location.href = '/';
        }

        let documentData = null;
        let quill = null;
        let docEditor = null;
        let currentUser = null;

        // Initialize Quill
        quill = new Quill('#quillEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    [{ 'color': [] }, { 'background': [] }],
                    ['link', 'image', 'code-block'],
                    ['clean']
                ]
            }
        });

        // Image upload handler
        quill.getModule('toolbar').addHandler('image', function() {
            const input = document.createElement('input');
            input.setAttribute('type', 'file');
            input.setAttribute('accept', 'image/*');
            input.click();

            input.onchange = async function() {
                const file = input.files[0];
                if (!file) return;

                try {
                    const formData = new FormData();
                    formData.append('file', file);

                    const response = await fetch('/api/v1/uploads/images', {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${api.token}`,
                        },
                        body: formData,
                    });

                    if (!response.ok) throw new Error('Upload failed');

                    const data = await response.json();
                    const range = quill.getSelection(true);
                    quill.insertEmbed(range.index, 'image', data.url);
                } catch (error) {
                    alert('Ошибка загрузки изображения: ' + error.message);
                }
            };
        });

        // Load user
        api.getCurrentUser().then(user => {
            currentUser = user;
            document.getElementById('userName').textContent = user.username || user.email;
        }).catch(() => {
            window.location.href = '/';
        });

        // Load document
        async function loadDocument() {
            try {
                documentData = await api.getDocument(documentId);
                const header = document.getElementById('documentHeader');
                header.innerHTML = `
                    <div class="project-title">${escapeHtml(documentData.title)}</div>
                    <div class="project-description">
                        <span class="text-muted">Создан: ${new Date(documentData.created_at).toLocaleString('ru-RU')}</span>
                        ${documentData.updated_at !== documentData.created_at ? 
                            `<span class="text-muted"> | Обновлен: ${new Date(documentData.updated_at).toLocaleString('ru-RU')}</span>` : ''}
                    </div>
                `;

                // Load content
                if (documentData.content_json && documentData.content_json.html) {
                    quill.root.innerHTML = documentData.content_json.html;
                } else if (documentData.content) {
                    // Convert Markdown to HTML
                    const html = marked.parse(documentData.content);
                    quill.root.innerHTML = html;
                }

                docEditor = new DocumentEditor(quill, api, documentId);

                // Auto-save on content change
                quill.on('text-change', () => {
                    docEditor.autoSave();
                });
            } catch (error) {
                console.error('Failed to load document:', error);
                alert('Ошибка загрузки документа: ' + error.message);
                goBack();
            }
        }

        async function saveDocument() {
            if (!docEditor) return;
            await docEditor.save();
        }

        function switchTab(tabName) {
            // Update tabs
            document.querySelectorAll('.editor-tab').forEach(tab => tab.classList.remove('active'));
            if (event && event.target) {
                event.target.classList.add('active');
            } else {
                // Find tab by data attribute or text
                const tabs = document.querySelectorAll('.editor-tab');
                tabs.forEach(tab => {
                    if (tab.textContent.includes(tabName === 'edit' ? 'Редактирование' : 
                                                 tabName === 'versions' ? 'Версии' : 'Комментарии')) {
                        tab.classList.add('active');
                    }
                });
            }

            // Update content
            document.querySelectorAll('.editor-tab-content').forEach(content => content.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');

            // Load data
            if (tabName === 'versions') {
                loadVersions();
            } else if (tabName === 'comments') {
                loadComments();
            }
        }

        async function loadVersions() {
            try {
                const versions = await api.getDocumentVersions(documentId);
                const container = document.getElementById('versionsList');
                
                if (versions.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Нет версий</p></div>';
                    return;
                }

                container.innerHTML = versions.map(version => `
                    <div class="version-item" onclick="loadVersion(${version.version_number})">
                        <div class="version-header">
                            <span class="version-number">Версия ${version.version_number}</span>
                            <span class="version-date">${new Date(version.created_at).toLocaleString('ru-RU')}</span>
                        </div>
                        ${version.change_summary ? `<p class="text-muted">${escapeHtml(version.change_summary)}</p>` : ''}
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load versions:', error);
                document.getElementById('versionsList').innerHTML = 
                    '<div class="empty-state"><p>Ошибка загрузки версий</p></div>';
            }
        }

        async function loadVersion(versionNumber) {
            try {
                const version = await api.getDocumentVersion(documentId, versionNumber);
                if (version.content) {
                    const html = marked.parse(version.content);
                    quill.root.innerHTML = html;
                }
                // Switch to edit tab
                document.querySelectorAll('.editor-tab').forEach(tab => tab.classList.remove('active'));
                document.querySelectorAll('.editor-tab-content').forEach(content => content.classList.remove('active'));
                document.querySelector('.editor-tab').classList.add('active');
                document.getElementById('editTab').classList.add('active');
            } catch (error) {
                alert('Ошибка загрузки версии: ' + error.message);
            }
        }

        async function loadComments() {
            try {
                const comments = await api.getDocumentComments(documentId);
                const container = document.getElementById('commentsList');
                
                if (comments.length === 0) {
                    container.innerHTML = '<div class="empty-state"><p>Нет комментариев</p></div>';
                    return;
                }

                container.innerHTML = comments.map(comment => `
                    <div class="comment-item ${comment.parent_id ? 'reply' : ''}">
                        <div class="comment-header">
                            <span class="comment-author">${escapeHtml(comment.author || 'Аноним')}</span>
                            <span class="comment-date">${new Date(comment.created_at).toLocaleString('ru-RU')}</span>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.text)}</div>
                        <div class="comment-actions">
                            <button class="btn btn-secondary" onclick="replyToComment('${comment.id}')">Ответить</button>
                            ${currentUser && currentUser.id === comment.author_id ? 
                                `<button class="btn btn-danger" onclick="deleteComment('${comment.id}')">Удалить</button>` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load comments:', error);
                document.getElementById('commentsList').innerHTML = 
                    '<div class="empty-state"><p>Ошибка загрузки комментариев</p></div>';
            }
        }

        async function addComment(parentId = null) {
            const text = document.getElementById('commentText').value.trim();
            if (!text) return;

            try {
                await api.createComment(documentId, text, parentId);
                document.getElementById('commentText').value = '';
                loadComments();
            } catch (error) {
                alert('Ошибка добавления комментария: ' + error.message);
            }
        }

        function replyToComment(commentId) {
            const text = prompt('Введите ответ:');
            if (text) {
                addComment(commentId);
            }
        }

        async function deleteComment(commentId) {
            if (!confirm('Удалить комментарий?')) return;
            try {
                await api.deleteComment(commentId);
                loadComments();
            } catch (error) {
                alert('Ошибка удаления комментария: ' + error.message);
            }
        }

        async function exportDocument(format) {
            try {
                await api.exportDocument(documentId, format);
            } catch (error) {
                alert('Ошибка экспорта: ' + error.message);
            }
        }

        function goBack() {
            if (documentData?.project_id) {
                window.location.href = `/project.html?id=${documentData.project_id}`;
            } else {
                window.location.href = '/dashboard.html';
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/';
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Initialize
        loadDocument();
    </script>
</body>
</html>
